function handleOmniMediaUpload(event) {
    const file = event.target.files[0];
    if (!file) return;

    const isVideo = file.type.startsWith('video/');
    const isImage = file.type.startsWith('image/');

    const reader = new FileReader();
    reader.onload = function(e) {
        currentCustomMedia = {
            url: e.target.result,
            name: file.name,
            type: isVideo ? 'video' : 'image',
            size: (file.size / (1024 * 1024)).toFixed(2) + ' MB',
            dataUrl: e.target.result
        };

        // Update preview in OmniRoute
        const previewContainer = document.getElementById('omniMediaPreviewWrap');
        if (previewContainer) {
            if (isVideo) {
                previewContainer.innerHTML = `
                    <div class="relative w-full rounded-xl overflow-hidden bg-black border border-slate-700">
                        <video src="${e.target.result}" controls class="w-full max-h-52 object-contain bg-black"></video>
                        <div class="p-2 bg-slate-900/90 border-t border-slate-800 flex items-center justify-between text-[11px] text-slate-300">
                            <span class="truncate font-mono">${file.name}</span>
                            <span class="text-emerald-400 font-semibold">${currentCustomMedia.size}</span>
                        </div>
                    </div>
                `;
            } else {
                previewContainer.innerHTML = `
                    <div class="relative w-full rounded-xl overflow-hidden bg-black border border-slate-700">
                        <img src="${e.target.result}" alt="Uploaded Image" class="w-full max-h-52 object-contain bg-black">
                        <div class="p-2 bg-slate-900/90 border-t border-slate-800 flex items-center justify-between text-[11px] text-slate-300">
                            <span class="truncate font-mono">${file.name}</span>
                            <span class="text-emerald-400 font-semibold">${currentCustomMedia.size}</span>
                        </div>
                    </div>
                `;
            }
        }

        // Auto-populate prompt with media context and auto-generate human caption
        const promptEl = document.getElementById('omniPrompt');
        if (promptEl) {
            const cleanName = file.name.replace(/\.[^/.]+$/, "").replace(/[-_]/g, " ");
            promptEl.value = `Custom media: "${cleanName}". Generate an authentic, high-converting organic caption and hook that sounds like a real human engineer/founder posting on social media.`;
        }

        // Trigger human-authentic generation
        generateOmniContent();
    };
    reader.readAsDataURL(file);
}

function loginWithInstagramDirect() {
    const ig = getInstagramConfig();
    const clientId = ig.appId || '1093847291048291';
    const redirectUri = encodeURIComponent(window.location.origin + '/crmdashboard.html');
    const scope = 'instagram_business_basic,instagram_business_content_publish,instagram_business_manage_messages,instagram_business_manage_comments';
    
    const authUrl = `https://api.instagram.com/oauth/authorize?enable_fb_login=0&force_authentication=1&client_id=${clientId}&redirect_uri=${redirectUri}&response_type=code&scope=${scope}`;
    
    window.open(authUrl, '_blank', 'width=600,height=700');
}

function saveInstagramCredentials(e) {
    e.preventDefault();
    const username = document.getElementById('cfgUsername').value.replace('@','').trim();
    const accountId = document.getElementById('cfgAccountId').value.trim();
    const appId = document.getElementById('cfgAppId').value.trim();
    const accountType = document.getElementById('cfgAccountType').value;

    const config = getInstagramConfig();
    config.connected = true;
    config.username = username;
    config.accountId = accountId;
    config.appId = appId;
    config.accountType = accountType;
    config.lastSync = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

    saveInstagramConfig(config);
    closeModal();
    renderSocial(document.getElementById('mainContent'));
    alert('Instagram Account @' + username + ' connected successfully via Meta Graph API!');
}

function handlePublisherMediaUpload(event) {
    const file = event.target.files[0];
    if (!file) return;

    const isVideo = file.type.startsWith('video/');
    const reader = new FileReader();
    reader.onload = function(e) {
        currentCustomMedia = {
            url: e.target.result,
            name: file.name,
            type: isVideo ? 'video' : 'image',
            size: (file.size / (1024 * 1024)).toFixed(2) + ' MB',
            dataUrl: e.target.result
        };

        const label = document.getElementById('publisherAssetLabel');
        if (label) label.textContent = `${file.name} (${currentCustomMedia.size})`;

        const previewArea = document.getElementById('publisherMediaPreviewArea');
        if (previewArea) {
            if (isVideo) {
                previewArea.innerHTML = `<video src="${e.target.result}" controls class="w-full h-full object-contain bg-black"></video>`;
            } else {
                previewArea.innerHTML = `<img src="${e.target.result}" class="w-full h-full object-contain bg-black">`;
            }
        }
    };
    reader.readAsDataURL(file);
}

async function publishInstagramReel() {
    const statusDiv = document.getElementById('reelsPublishStatus');
    const statusText = document.getElementById('reelsStatusText');
    const btn = document.getElementById('btnPublishReel');
    const caption = document.getElementById('reelCaption') ? document.getElementById('reelCaption').value : '';
    const ig = getInstagramConfig();

    statusDiv.classList.remove('hidden');
    statusDiv.className = "mb-4 p-3 rounded-xl bg-pink-500/10 border border-pink-500/30 text-xs text-pink-300 flex items-center gap-2";
    btn.disabled = true;
    btn.classList.add('opacity-50');

    statusText.textContent = "1/3 Initializing Meta Graph API video upload container...";

    // Determine public media URL for Meta Graph API container
    let mediaPublicUrl = window.location.origin + (currentCustomMedia.url || '/axonflow_cinematic_reels_shorts.mp4');
    if (currentCustomMedia.dataUrl && !currentCustomMedia.dataUrl.startsWith('http')) {
        // Fallback to cinematic showcase if custom upload is purely base64 local
        mediaPublicUrl = window.location.origin + '/axonflow_cinematic_reels_shorts.mp4';
    }

    try {
        if (ig.accessToken && !ig.accessToken.startsWith('EAAPwQz9...')) {
            statusText.textContent = "2/3 Uploading container to Meta Graph API for @" + ig.username + "...";

            const res = await fetch('/.netlify/functions/instagram-publish', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    accountId: ig.accountId,
                    accessToken: ig.accessToken,
                    mediaUrl: mediaPublicUrl,
                    caption: caption,
                    mediaType: currentCustomMedia.type
                })
            });

            const data = await res.json();
            if (!res.ok || data.error) {
                throw new Error(data.error || 'Meta API rejected publish request. Please verify token permissions in Configure API Keys.');
            }

            statusDiv.className = "mb-4 p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-xs text-emerald-300 flex items-center gap-2";
            statusDiv.innerHTML = `✅ <strong>Success!</strong> Live Post ID: <code>${data.mediaId}</code> is now public on <a href="https://instagram.com/${ig.username}" target="_blank" class="underline ml-1 text-white">instagram.com/${ig.username}</a>`;
            ig.mediaCount += 1;
            saveInstagramConfig(ig);
        } else {
            // Simulated / Token Prompt Flow
            setTimeout(() => {
                statusText.textContent = `2/3 Processing container for @${ig.username}...`;
                setTimeout(() => {
                    statusDiv.className = "mb-4 p-3 rounded-xl bg-amber-500/10 border border-amber-500/30 text-xs text-amber-300 flex flex-col gap-2";
                    statusDiv.innerHTML = `
                        <div class="flex items-center gap-2">
                            <span>🔑 <strong>Access Token Required for Live Meta Push:</strong></span>
                        </div>
                        <p class="text-[11px] text-slate-300">To push directly to live Instagram from your CRM, click <strong><a href="javascript:openInstagramConnectModal()" class="text-pink-400 underline">Configure API Keys</a></strong> and paste your Meta User / System Token from Meta Business Suite.</p>
                        <p class="text-[11px] text-slate-400">Or click <strong>Download & Copy Caption</strong> below to post in 5 seconds via Instagram app or Meta Suite!</p>
                    `;
                }, 1000);
            }, 800);
        }
    } catch (err) {
        statusDiv.className = "mb-4 p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-xs text-rose-300 flex items-center gap-2";
        statusDiv.innerHTML = `❌ <strong>Meta API Error:</strong> ${err.message} <button onclick="openInstagramConnectModal()" class="ml-2 underline text-white">Update Token</button>`;
    } finally {
        btn.disabled = false;
        btn.classList.remove('opacity-50');
    }
}

function instantDownloadAndCopy() {
    const caption = document.getElementById('reelCaption') ? document.getElementById('reelCaption').value : '';
    const btnText = document.getElementById('btnInstantText');

    // 1. Copy caption to clipboard
    if (caption) {
        navigator.clipboard.writeText(caption);
    }

    // 2. Download media file
    const downloadUrl = currentCustomMedia.dataUrl || currentCustomMedia.url;
    const a = document.createElement('a');
    a.href = downloadUrl;
    a.download = currentCustomMedia.name || 'axonflow_post_asset.mp4';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    if (btnText) {
        btnText.textContent = "Downloaded & Copied! ✓";
        setTimeout(() => { btnText.textContent = "Download & Copy Caption"; }, 3000);
    }

    alert("✅ Media asset downloaded & organic caption copied to clipboard!\n\nYou can now open the Instagram app or Meta Business Suite to share it directly to @axonflowai.in in 5 seconds!");
}

// ---------- ANALYTICS ----------
function renderAnalytics(container) {
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const monthlyCounts = new Array(12).fill(0);
    CRM.enquiries.forEach(e => {
        const m = new Date(e.date).getMonth();
        monthlyCounts[m]++;
    });
    const maxCount = Math.max(...monthlyCounts, 1);

    const statusCounts = {};
    CRM.enquiries.forEach(e => { statusCounts[e.status] = (statusCounts[e.status] || 0) + 1; });
    const statusColors = { New: '#06b6d4', Contacted: '#a855f7', Qualified: '#eab308', Converted: '#22c55e', Closed: '#64748b' };
    const totalEnq = CRM.enquiries.length || 1;
    let pieGradient = '';
    let angle = 0;
    const statusEntries = Object.entries(statusCounts);
    statusEntries.forEach(([status, count]) => {
        const pct = (count / totalEnq) * 360;
        pieGradient += `${statusColors[status] || '#64748b'} ${angle}deg ${angle + pct}deg, `;
        angle += pct;
    });
    pieGradient = pieGradient.slice(0, -2);

    const deptCounts = {};
    CRM.team.forEach(t => { deptCounts[t.department] = (deptCounts[t.department] || 0) + 1; });
    const maxDept = Math.max(...Object.values(deptCounts), 1);

    container.innerHTML = `
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
            <div class="glass-card rounded-2xl p-6">
                <h3 class="text-white font-semibold mb-4">Enquiries by Month</h3>
                <div class="flex items-end space-x-2 h-48">
                    ${monthlyCounts.map((c, i) => `
                        <div class="flex-1 flex flex-col items-center">
                            <div class="w-full bg-gradient-to-t from-cyan-500 to-purple-500 rounded-t-md bar-chart-bar" style="height: ${(c / maxCount) * 160}px; min-height: ${c > 0 ? '8px' : '2px'}" title="${months[i]}: ${c}"></div>
                            <span class="text-xs text-slate-500 mt-2">${months[i]}</span>
                        </div>`).join('')}
                </div>
            </div>
            <div class="glass-card rounded-2xl p-6">
                <h3 class="text-white font-semibold mb-4">Status Breakdown</h3>
                <div class="flex items-center space-x-8">
                    <div class="pie-chart flex-shrink-0" style="background: conic-gradient(${pieGradient});" role="img" aria-label="Status breakdown pie chart"></div>
                    <div class="space-y-2">
                        ${statusEntries.map(([status, count]) => `
                            <div class="flex items-center space-x-2">
                                <div class="w-3 h-3 rounded-full flex-shrink-0" style="background: ${statusColors[status]}"></div>
                                <span class="text-sm text-slate-300">${status}</span>
                                <span class="text-sm text-slate-500 ml-auto">${count}</span>
                            </div>`).join('')}
                    </div>
                </div>
            </div>
        </div>
        <div class="glass-card rounded-2xl p-6">
            <h3 class="text-white font-semibold mb-4">Team Distribution by Department</h3>
            <div class="space-y-4">
                ${Object.entries(deptCounts).map(([dept, count]) => `
                    <div>
                        <div class="flex items-center justify-between mb-1">
                            <span class="text-sm text-slate-300">${dept}</span>
                            <span class="text-sm text-slate-500">${count} member${count !== 1 ? 's' : ''}</span>
                        </div>
                        <div class="w-full h-2.5 bg-slate-800 rounded-full overflow-hidden">
                            <div class="h-full bg-gradient-to-r from-cyan-500 to-purple-500 rounded-full transition-all duration-700" style="width: ${(count / maxDept) * 100}%"></div>
                        </div>
                    </div>`).join('')}
            </div>
        </div>`;
}

// ============================================
// UTILITIES
// ============================================
function esc(str) {
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
}

function statusBadge(status) {
    const colors = {
        New: 'bg-cyan-500/20 text-cyan-400 border border-cyan-500/30',
        Contacted: 'bg-purple-500/20 text-purple-400 border border-purple-500/30',
        Qualified: 'bg-yellow-500/20 text-yellow-400 border border-yellow-500/30',
        Converted: 'bg-green-500/20 text-green-400 border border-green-500/30',
        Closed: 'bg-slate-500/20 text-slate-400 border border-slate-500/30'
    };
    return `<span class="status-badge inline-block ${colors[status] || ''}">${status}</span>`;
}

function showModal(html) {
    document.getElementById('modalContent').innerHTML = html;
    document.getElementById('modalOverlay').classList.remove('hidden');
    const firstInput = document.querySelector('#modalContent input, #modalContent select, #modalContent textarea');
    if (firstInput) firstInput.focus();
}

function closeModal() { document.getElementById('modalOverlay').classList.add('hidden'); }

function downloadFile(content, filename, type) {
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
}

document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });

// Initial render
showSection('dashboard');
</script>
</body>
</html>
