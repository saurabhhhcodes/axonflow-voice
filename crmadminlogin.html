<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="shortcut icon" type="image/png" href="/assets/logo_pro.png">
    <link rel="canonical" href="https://axonflow.in/crmadminlogin">
    <meta property="og:type" content="website">

    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="AxonFlow CRM Login">
    <meta name="twitter:description" content="Secure admin login for AxonFlow CRM system.">

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebPage",
        "name": "AxonFlow CRM Login",

            "name": "AxonFlow AI",
            "url": "https://axonflow.in"
        }
    }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: { 950: '#020617' }
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/enterprise.css">
    <style>
        body { font-family: var(--font-body); background: var(--bg); color: var(--text); }
        .login-bg {
            background: linear-gradient(135deg, #000000 0%, #0a0a0a 50%, #000000 100%);
        }
        .login-bg::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 20% 50%, rgba(6, 182, 212, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 80% 50%, rgba(139, 92, 246, 0.08) 0%, transparent 50%);
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(100, 116, 139, 0.2);
        }
        .input-field {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(100, 116, 139, 0.3);
            transition: all 0.3s ease;
        }
        .input-field:focus {
            border-color: rgba(6, 182, 212, 0.6);
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.1);
            outline: none;
        }
        .btn-gradient {
            background: linear-gradient(135deg, #06b6d4, #9333ea);
            transition: all 0.3s ease;
        }
        .btn-gradient:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(6, 182, 212, 0.3);
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.5s ease forwards; }
    </style>
</head>
<body class="login-bg min-h-screen flex items-center justify-center antialiased selection:bg-cyan-500/30 font-['Inter']">
    <div class="login-bg fixed inset-0"></div>
    <nav class="fixed top-0 left-0 right-0 z-50 bg-black/50 backdrop-blur-xl border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-6 h-14 flex items-center justify-between">
            <a href="/" class="flex items-center space-x-2">
                <img src="/assets/logo_pro.png" alt="AxonFlow AI" class="h-7">
                <span class="text-sm font-bold tracking-tighter uppercase text-white/80">AXONFLOW AI</span>
            </a>
            <a href="/" class="text-cyan-400 hover:text-cyan-300 text-xs font-medium transition-colors">Back to Site</a>
        </div>
    </nav>
    <div class="relative z-10 w-full max-w-md px-6 fade-in pt-24">
        <div class="glass-card rounded-2xl p-8 shadow-2xl shadow-black/50">
            <div class="text-center mb-8">
                <img src="/assets/logo_pro.png" alt="AxonFlow AI" class="h-16 mx-auto mb-4">
                <h1 class="text-2xl font-bold text-white tracking-tight">AxonFlow CRM</h1>
                <p class="text-slate-400 text-sm mt-1">Admin Portal</p>
            </div>
            <form id="loginForm" class="space-y-5" aria-label="Admin login form">
                <div>
                    <label for="email" class="block text-sm font-medium text-slate-300 mb-1.5">Email Address</label>
                    <input type="email" id="email" name="email" required autocomplete="email"
                        class="input-field w-full px-4 py-3 rounded-xl text-white placeholder-slate-500 text-sm"
                        placeholder="admin@axonflow.in" aria-describedby="email-error">
                    <p id="email-error" class="text-red-400 text-xs mt-1 hidden">Please enter a valid email</p>
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-slate-300 mb-1.5">Password</label>
                    <div class="relative">
                        <input type="password" id="password" name="password" required autocomplete="current-password"
                            class="input-field w-full px-4 py-3 pr-12 rounded-xl text-white placeholder-slate-500 text-sm"
                            placeholder="Enter password" aria-describedby="password-error">
                        <button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white transition-colors" aria-label="Toggle password visibility">
                            <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                            </svg>
                            <svg id="eyeOffIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M3 3l18 18"/>
                            </svg>
                        </button>
                    </div>
                    <p id="password-error" class="text-red-400 text-xs mt-1 hidden">Password is required</p>
                </div>
                <div id="loginError" class="hidden bg-red-500/10 border border-red-500/30 rounded-xl p-3">
                    <p class="text-red-400 text-sm text-center">Invalid credentials. Please try again.</p>
                </div>
                <button type="submit" id="loginBtn"
                    class="btn-gradient w-full py-3 rounded-xl text-white font-semibold text-sm tracking-wide">
                    Sign In
                </button>
            </form>
            <div class="mt-6 pt-6 border-t border-slate-700/50 text-center">
                <p class="text-slate-500 text-xs">Protected area. Unauthorized access is prohibited.</p>
            </div>
        </div>
    </div>
    <footer class="relative w-full z-10 border-t border-slate-800 bg-black/50 backdrop-blur-xl mt-12">
        <div class="max-w-7xl mx-auto px-6 py-6 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center space-x-3">
                <img src="/assets/logo_pro.png" alt="AxonFlow AI" class="h-6">
                <span class="text-sm font-bold tracking-tighter uppercase text-white/80">AXONFLOW AI</span>
            </div>
            <p class="text-slate-600 text-xs">&copy; 2025 AxonFlow AI. All rights reserved. <span class="text-slate-700">UDYAM-UP-50-0236406</span></p>
            <a href="/" class="text-cyan-400 hover:text-cyan-300 text-xs font-medium transition-colors">Back to Site</a>
        </div>
    </footer>
    <script>
        const CRM_CREDENTIALS = { email: 'admin@axonflow.in', password: 'axonflow2025' };
        const SESSION_KEY = 'crm_admin_session';

        (function checkSession() {
            const session = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
            if (session && session.authenticated && session.email === CRM_CREDENTIALS.email) {
                window.location.href = '/crmdashboard';
            }
        })();

        function togglePassword() {
            const pw = document.getElementById('password');
            const eye = document.getElementById('eyeIcon');
            const eyeOff = document.getElementById('eyeOffIcon');
            if (pw.type === 'password') {
                pw.type = 'text';
                eye.classList.add('hidden');
                eyeOff.classList.remove('hidden');
            } else {
                pw.type = 'password';
                eye.classList.remove('hidden');
                eyeOff.classList.add('hidden');
            }
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const emailErr = document.getElementById('email-error');
            const pwErr = document.getElementById('password-error');
            const loginErr = document.getElementById('loginError');
            let valid = true;

            emailErr.classList.add('hidden');
            pwErr.classList.add('hidden');
            loginErr.classList.add('hidden');

            if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                emailErr.classList.remove('hidden');
                valid = false;
            }
            if (!password) {
                pwErr.classList.remove('hidden');
                valid = false;
            }
            if (!valid) return;

            if (email === CRM_CREDENTIALS.email && password === CRM_CREDENTIALS.password) {
                const session = {
                    authenticated: true,
                    email: email,
                    loginTime: new Date().toISOString(),
                    expiresAt: new Date(Date.now() + 8 * 60 * 60 * 1000).toISOString()
                };
                localStorage.setItem(SESSION_KEY, JSON.stringify(session));
                window.location.href = '/crmdashboard';
            } else {
                loginErr.classList.remove('hidden');
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
            }
        });

        document.getElementById('email').focus();
    </script>
</body>
</html>
