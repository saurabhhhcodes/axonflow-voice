plugins = []
redirects = []

[functions]

[functions."*"]

[build]
publish = "/Users/saurabhkumarbajpaiai/.gemini/antigravity/scratch/autonomiq-website"
publishOrigin = "default"

[build.environment]

[build.processing]

[build.processing.css]

[build.processing.html]

[build.processing.images]

[build.processing.js]

[build.services]

[[headers]]
for = "/*"

[headers.values]
Cache-Control = "no-cache, must-revalidate"
X-Deploy-Version = "2026-07-26"

[[headers]]
for = "/*.html"

[headers.values]
Cache-Control = "no-store"
X-Content-Type-Options = "nosniff"

[[headers]]
for = "/css/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/assets/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/js/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"