function handleOmniMediaUpload(event) {
    const file = event.target.files[0];
    if (!file) return;

    const isVideo = file.type.startsWith('video/');
    const isImage = file.type.startsWith('image/');

    const reader = new FileReader();
    reader.onload = async function(e) {
        let processedDataUrl = e.target.result;
        if (!isVideo) {
            processedDataUrl = await optimizeImageForMetaInstagram(e.target.result);
        }

        currentCustomMedia = {
            url: processedDataUrl,
            name: file.name,
            type: isVideo ? 'video' : 'image',
            size: (file.size / (1024 * 1024)).toFixed(2) + ' MB',
            dataUrl: processedDataUrl,
            publicUrl: null
        };

        // Update preview in OmniRoute
        const previewContainer = document.getElementById('omniMediaPreviewWrap');
        if (previewContainer) {
            if (isVideo) {
                previewContainer.innerHTML = `
                    <div class="relative w-full rounded-xl overflow-hidden bg-black border border-slate-700">
                        <video src="${e.target.result}" controls class="w-full max-h-52 object-contain bg-black"></video>
                        <div class="p-2 bg-slate-900/90 border-t border-slate-800 flex items-center justify-between text-[11px] text-slate-300">
                            <span class="truncate font-mono">${file.name}</span>
                            <span class="text-emerald-400 font-semibold">${currentCustomMedia.size}</span>
                        </div>
                    </div>
                `;
            } else {
                previewContainer.innerHTML = `
                    <div class="relative w-full rounded-xl overflow-hidden bg-black border border-slate-700">
                        <img src="${e.target.result}" alt="Uploaded Image" class="w-full max-h-52 object-contain bg-black">
                        <div class="p-2 bg-slate-900/90 border-t border-slate-800 flex items-center justify-between text-[11px] text-slate-300">
                            <span class="truncate font-mono">${file.name}</span>
                            <span class="text-emerald-400 font-semibold">${currentCustomMedia.size}</span>
                        </div>
                    </div>
                `;
            }
        }

        // Auto-populate prompt with media context and auto-generate human caption
        const promptEl = document.getElementById('omniPrompt');
        if (promptEl) {
            const cleanName = file.name.replace(/\.[^/.]+$/, "").replace(/[-_]/g, " ");
            promptEl.value = `Custom media: "${cleanName}". Generate an authentic, high-converting organic caption and hook that sounds like a real human engineer/founder posting on social media.`;
        }

        // Trigger human-authentic generation
        generateOmniContent();
    };
    reader.readAsDataURL(file);
}

async function generateElevenLabsVoice(text, targetAudioId, statusTextId, btnId) {
    const elConfig = getElevenLabsConfig();
    const statusEl = document.getElementById(statusTextId);
    const audioEl = document.getElementById(targetAudioId);
    const btn = document.getElementById(btnId);

    if (!text || !text.trim()) {
        alert("Please provide or generate a script/hook first before generating voiceover.");
        return;
    }

    if (!elConfig.apiKey) {
        const key = prompt("Please enter your ElevenLabs API Key (starts with xi-... or standard 32-char key):");
        if (!key) return;
        elConfig.apiKey = key.trim();
        saveElevenLabsConfig(elConfig);
    }

    if (btn) {
        btn.disabled = true;
        btn.classList.add('opacity-50');
    }
    if (statusEl) {
        statusEl.classList.remove('hidden');
        statusEl.innerHTML = `<span class="animate-spin inline-block">🎙️</span> <span>Generating ElevenLabs human voiceover using <strong>${elConfig.voiceName || 'Adam'}</strong>...</span>`;
    }

    try {
        const res = await fetch('/.netlify/functions/elevenlabs-voice', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                text: text,
                voiceId: elConfig.voiceId || 'pNInz6obpgDQGcFmaJgB',
                apiKey: elConfig.apiKey,
                modelId: elConfig.modelId || 'eleven_multilingual_v2'
            })
        });

        const data = await res.json();
        if (!res.ok || data.error) {
            throw new Error(data.error || 'ElevenLabs voice generation failed');
        }

        if (audioEl) {
            audioEl.src = data.audioDataUrl;
            audioEl.classList.remove('hidden');
            audioEl.play().catch(() => {});
        }

        if (statusEl) {
            statusEl.className = "p-2.5 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-xs text-emerald-300 flex items-center justify-between";
            statusEl.innerHTML = `
                <span>✅ <strong>Voiceover Ready!</strong> (${data.audioSize})</span>
                <a href="${data.audioDataUrl}" download="axonflow_voiceover.mp3" class="px-2.5 py-1 rounded bg-emerald-500/20 text-white hover:bg-emerald-500/30 font-mono text-[10px]">
                    Download MP3 ⬇
                </a>
            `;
        }

    } catch (err) {
        if (statusEl) {
            statusEl.className = "p-2.5 rounded-xl bg-rose-500/10 border border-rose-500/30 text-xs text-rose-300 flex items-center justify-between";
            statusEl.innerHTML = `
                <span>❌ <strong>Voice Error:</strong> ${err.message}</span>
                <button onclick="openInstagramConnectModal()" class="underline text-white font-semibold">Change Key</button>
            `;
        }
    } finally {
        if (btn) {
            btn.disabled = false;
            btn.classList.remove('opacity-50');
        }
    }
}

        if (container) renderSocial(container);
    }
}

function queueCurrentReelForApproval() {
    const caption = document.getElementById('reelCaption') ? document.getElementById('reelCaption').value : '';
    const newId = 'appr_' + Date.now();
    
    instagramApprovalQueue.unshift({
        id: newId,
        title: currentCustomMedia.name || 'Custom Video Creation',
        pageUrl: 'https://axonflow.in/',
        mediaUrl: currentCustomMedia.url || '/axonflow_cinematic_reels_shorts.mp4',
        mediaName: currentCustomMedia.name || 'custom_reel.mp4',
        mediaType: currentCustomMedia.type || 'video',
        status: 'PENDING_APPROVAL',
        date: 'Just now',
        hook: 'New custom drafted reel awaiting admin review',
        caption: caption
    });

    alert("✅ Reel successfully queued for approval! Go to the 'Approval Queue' tab to review and release.");
    switchSocialTab('approval');
}

function replyToInstagramComment(commentId) {
    const input = document.getElementById(`replyInput_${commentId}`);
    if (!input || !input.value.trim()) return;

    const cmt = instagramCommentsList.find(c => c.id === commentId);
    if (!cmt) return;

    cmt.reply = input.value.trim();
    cmt.repliedAt = 'Just now';
    cmt.aiReplied = false;

    const container = document.getElementById('dashboardContent');
    if (container) renderSocial(container);
}

function sendSocialDmMessage() {
    const input = document.getElementById('activeDmInput');
    if (!input || !input.value.trim()) return;

    const thread = instagramDmConversations.find(t => t.id === activeDmThread);
    if (!thread) return;

    thread.messages.push({
        sender: 'ai',
        text: input.value.trim(),
        time: 'Just now'
    });

    input.value = '';
    const container = document.getElementById('dashboardContent');
    if (container) renderSocial(container);
}

    activeDmThread = threadId;
    const thread = instagramDmConversations.find(t => t.id === threadId);

    if (container) renderSocial(container);
}

function optimizeImageForMetaInstagram(dataUrl) {
    return new Promise((resolve) => {
        const img = new Image();
        img.onload = function() {
            // Format onto a guaranteed 1:1 Square (1080x1080) canvas — 100% universally compliant with Meta Graph API across all accounts
            const canvas = document.createElement('canvas');
            const targetW = 1080;
            const targetH = 1080;
            canvas.width = targetW;
            canvas.height = targetH;
            const ctx = canvas.getContext('2d');

            // Dark enterprise studio backdrop
            const grad = ctx.createLinearGradient(0, 0, targetW, targetH);
            grad.addColorStop(0, '#090d16');
            grad.addColorStop(0.5, '#020617');
            grad.addColorStop(1, '#090d16');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, targetW, targetH);

            // Subtle studio tech grid
            ctx.fillStyle = 'rgba(255, 255, 255, 0.02)';
            for (let x = 0; x < targetW; x += 40) ctx.fillRect(x, 0, 1, targetH);
            for (let y = 0; y < targetH; y += 40) ctx.fillRect(0, y, targetW, 1);

            // Scale and center image cleanly
            const nw = img.naturalWidth || img.width || 1080;
            const nh = img.naturalHeight || img.height || 1080;
            const scale = Math.min(targetW / nw, targetH / nh) * 0.96;
            const drawW = nw * scale;
            const drawH = nh * scale;
            const drawX = (targetW - drawW) / 2;
            const drawY = (targetH - drawH) / 2;

            ctx.shadowColor = 'rgba(0,0,0,0.6)';
            ctx.shadowBlur = 30;
            ctx.shadowOffsetY = 10;

            ctx.drawImage(img, drawX, drawY, drawW, drawH);

            resolve(canvas.toDataURL('image/jpeg', 0.95));
        };
        img.onerror = () => resolve(dataUrl);
        img.src = dataUrl;
    });
}

function handlePublisherMediaUpload(event) {
    const file = event.target.files[0];
    if (!file) return;

    const isVideo = file.type.startsWith('video/');
    const reader = new FileReader();
    reader.onload = async function(e) {
        let processedDataUrl = e.target.result;
        if (!isVideo) {
            processedDataUrl = await optimizeImageForMetaInstagram(e.target.result);
        }

        currentCustomMedia = {
            url: processedDataUrl,
            name: file.name,
            type: isVideo ? 'video' : 'image',
            size: (file.size / (1024 * 1024)).toFixed(2) + ' MB',
            dataUrl: processedDataUrl,
            publicUrl: null
        };

        const label = document.getElementById('publisherAssetLabel');
        if (label) label.textContent = `${file.name} (Meta 1:1 Compliant)`;

        const previewArea = document.getElementById('publisherMediaPreviewArea');
        if (previewArea) {
            if (isVideo) {
                previewArea.innerHTML = `<video src="${processedDataUrl}" controls class="w-full h-full object-contain bg-black"></video>`;
            } else {
                previewArea.innerHTML = `<img src="${processedDataUrl}" class="w-full h-full object-contain bg-black">`;
            }
        }
    };
    reader.readAsDataURL(file);
}

async function publishInstagramReel() {
    const statusDiv = document.getElementById('reelsPublishStatus');
    const statusText = document.getElementById('reelsStatusText');
    const btn = document.getElementById('btnPublishReel');
    const caption = document.getElementById('reelCaption') ? document.getElementById('reelCaption').value : '';
    const ig = getInstagramConfig();

    statusDiv.classList.remove('hidden');
    statusDiv.className = "mb-4 p-3 rounded-xl bg-pink-500/10 border border-pink-500/30 text-xs text-pink-300 flex items-center gap-2";
    btn.disabled = true;
    btn.classList.add('opacity-50');

    statusText.textContent = "1/3 Preparing custom media for Meta Graph API...";

    const token = ig.accessToken || 'IGAAUpwSIMCRpBZAGFiYl9Gd1BRZAm1NYU5tVU91WDNxZAU1oQkVCbnEtUXZA0OU9mRWsxa1g4cWVycW1NU0FsRG9MRUU4NlpIUEZAseUJyaC04SXp2WXhmMXVEQ2JfbXpPbkgtVEpnekxJSmEtQy0tVm05T2ZAMakUyT3Q1WDFsRHNsTQZDZD';
    const igUserId = ig.accountId || '27982373448109546';
    const isVideo = currentCustomMedia.type === 'video';

    const apiBase = token.startsWith('IGA') 
        ? 'https://graph.instagram.com/v18.0' 
        : 'https://graph.facebook.com/v18.0';

    try {
        let publicMediaUrl = null;

        // If custom uploaded image/video (base64 dataUrl), optimize aspect ratio and host it on the media serverless endpoint
        if (currentCustomMedia.dataUrl) {
            statusText.textContent = "1/3 Formatting to 1080x1080 & uploading to media host...";
            
            let uploadPayload = currentCustomMedia.dataUrl;
            if (!isVideo) {
                uploadPayload = await optimizeImageForMetaInstagram(currentCustomMedia.dataUrl);
            }

            try {
                const uploadRes = await fetch('/.netlify/functions/media', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        fileData: uploadPayload,
                        fileName: currentCustomMedia.name,
                        mimeType: isVideo ? 'video/mp4' : 'image/jpeg'
                    })
                });
                const uploadData = await uploadRes.json();
                if (uploadData.success && uploadData.publicUrl) {
                    publicMediaUrl = uploadData.publicUrl;
                    currentCustomMedia.publicUrl = publicMediaUrl;
                }
            } catch(uErr) {
                console.warn('Custom media host fallback:', uErr);
            }
        }

        // Fallback to default showcase video / logo if no custom media was uploaded
        if (!publicMediaUrl) {
            publicMediaUrl = isVideo 
                ? 'https://www.axonflow.in/axonflow_cinematic_reels_shorts.mp4'
                : 'https://www.axonflow.in/assets/logo_pro.png';
        }

        statusText.textContent = `2/3 Uploading '${currentCustomMedia.name}' to Meta Graph API...`;

        // Step 1: Create Container
        const containerUrl = `${apiBase}/${igUserId}/media`;
        const params = new URLSearchParams();
        params.append('access_token', token);
        params.append('caption', caption || '🚀 Transforming enterprise operations with autonomous AI agents. Explore our production systems at https://axonflow.in #AxonFlowAI #EnterpriseAI');

        if (isVideo) {
            params.append('media_type', 'REELS');
            params.append('video_url', publicMediaUrl);
            params.append('share_to_feed', 'true');
        } else {
            params.append('image_url', publicMediaUrl);
        }

        const createRes = await fetch(`${containerUrl}?${params.toString()}`, { method: 'POST' });
        const createData = await createRes.json();

        if (createData.error) {
            throw new Error(createData.error.message || 'Failed to create Meta media container');
        }

        const containerId = createData.id;

        // Step 2: Poll container status until ready
        let ready = false;
        for (let attempt = 1; attempt <= 12; attempt++) {
            statusText.textContent = `2/3 Meta processing media container (Attempt ${attempt}/12)...`;
            await new Promise(r => setTimeout(r, 2000));

            const statusRes = await fetch(`${apiBase}/${containerId}?fields=status_code,status&access_token=${token}`);
            const statusData = await statusRes.json();

            if (statusData.status_code === 'FINISHED' || (!statusData.status_code && !statusData.error)) {
                ready = true;
                break;
            } else if (statusData.status_code === 'ERROR') {
                throw new Error('Meta media processing failed: ' + (statusData.status || 'Format error'));
            }
        }

        // Step 3: Publish Container
        statusText.textContent = "3/3 Container verified. Publishing live to Instagram...";
        const publishUrl = `${apiBase}/${igUserId}/media_publish`;
        const pubParams = new URLSearchParams();
        pubParams.append('creation_id', containerId);
        pubParams.append('access_token', token);

        const pubRes = await fetch(`${publishUrl}?${pubParams.toString()}`, { method: 'POST' });
        const pubData = await pubRes.json();

        if (pubData.error) {
            throw new Error(pubData.error.message || 'Failed to publish media container');
        }

        statusDiv.className = "mb-4 p-3.5 rounded-xl bg-emerald-500/15 border border-emerald-500/30 text-xs text-emerald-300 flex flex-wrap items-center justify-between gap-2";
        statusDiv.innerHTML = `
            <div class="flex items-center gap-2">
                <span class="text-base">✅</span>
                <span><strong>Published Live!</strong> Post ID: <code class="font-mono bg-emerald-950 px-1.5 py-0.5 rounded text-white">${pubData.id}</code></span>
            </div>
            <a href="https://instagram.com/${ig.username}" target="_blank" class="px-3 py-1 rounded-lg bg-emerald-500/20 hover:bg-emerald-500/30 text-white font-semibold flex items-center gap-1 transition-all">
                <span>View on Instagram &rarr;</span>
            </a>
        `;
        ig.mediaCount += 1;
        saveInstagramConfig(ig);

    } catch (err) {
        statusDiv.className = "mb-4 p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-xs text-rose-300 flex items-center gap-2";
        statusDiv.innerHTML = `❌ <strong>Meta API Error:</strong> ${err.message} <button onclick="openInstagramConnectModal()" class="ml-2 underline text-white">Update Token</button>`;
    } finally {
        btn.disabled = false;
        btn.classList.remove('opacity-50');
    }
}

    const filtered = CRM.proposals.filter(p =>
        (!status || p.status === status) &&
        (!search || p.studentName.toLowerCase().includes(search) || p.email.toLowerCase().includes(search) || p.college.toLowerCase().includes(search) || p.domain.toLowerCase().includes(search))
    );
    document.getElementById('propTableBody').innerHTML = filtered.length ? filtered.map(p => `

function exportEnquiriesCSV() {
    const headers = ['Name','Email','Phone','Company','Service','Message','Date','Status'];
    const rows = CRM.enquiries.map(e => [e.name, e.email, e.phone, e.company, e.service, e.message, e.date, e.status]);

    downloadFile(csv, 'enquiries.csv', 'text/csv');
}

// ---------- ANALYTICS ----------
function renderAnalytics(container) {
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const monthlyCounts = new Array(12).fill(0);
    CRM.enquiries.forEach(e => {
        const m = new Date(e.date).getMonth();
        monthlyCounts[m]++;
    });
    const maxCount = Math.max(...monthlyCounts, 1);

    const statusCounts = {};
    CRM.enquiries.forEach(e => { statusCounts[e.status] = (statusCounts[e.status] || 0) + 1; });
    const statusColors = { New: '#06b6d4', Contacted: '#a855f7', Qualified: '#eab308', Converted: '#22c55e', Closed: '#64748b' };
    const totalEnq = CRM.enquiries.length || 1;
    let pieGradient = '';
    let angle = 0;
    const statusEntries = Object.entries(statusCounts);
    statusEntries.forEach(([status, count]) => {
        const pct = (count / totalEnq) * 360;
        pieGradient += `${statusColors[status] || '#64748b'} ${angle}deg ${angle + pct}deg, `;
        angle += pct;
    });
    pieGradient = pieGradient.slice(0, -2);

    const deptCounts = {};
    CRM.team.forEach(t => { deptCounts[t.department] = (deptCounts[t.department] || 0) + 1; });
    const maxDept = Math.max(...Object.values(deptCounts), 1);

    container.innerHTML = `
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
            <div class="glass-card rounded-2xl p-6">
                <h3 class="text-white font-semibold mb-4">Enquiries by Month</h3>
                <div class="flex items-end space-x-2 h-48">
                    ${monthlyCounts.map((c, i) => `
                        <div class="flex-1 flex flex-col items-center">
                            <div class="w-full bg-gradient-to-t from-cyan-500 to-purple-500 rounded-t-md bar-chart-bar" style="height: ${(c / maxCount) * 160}px; min-height: ${c > 0 ? '8px' : '2px'}" title="${months[i]}: ${c}"></div>
                            <span class="text-xs text-slate-500 mt-2">${months[i]}</span>
                        </div>`).join('')}
                </div>
            </div>
            <div class="glass-card rounded-2xl p-6">
                <h3 class="text-white font-semibold mb-4">Status Breakdown</h3>
                <div class="flex items-center space-x-8">
                    <div class="pie-chart flex-shrink-0" style="background: conic-gradient(${pieGradient});" role="img" aria-label="Status breakdown pie chart"></div>
                    <div class="space-y-2">
                        ${statusEntries.map(([status, count]) => `
                            <div class="flex items-center space-x-2">
                                <div class="w-3 h-3 rounded-full flex-shrink-0" style="background: ${statusColors[status]}"></div>
                                <span class="text-sm text-slate-300">${status}</span>
                                <span class="text-sm text-slate-500 ml-auto">${count}</span>
                            </div>`).join('')}
                    </div>
                </div>
            </div>
        </div>
        <div class="glass-card rounded-2xl p-6">
            <h3 class="text-white font-semibold mb-4">Team Distribution by Department</h3>
            <div class="space-y-4">
                ${Object.entries(deptCounts).map(([dept, count]) => `
                    <div>
                        <div class="flex items-center justify-between mb-1">
                            <span class="text-sm text-slate-300">${dept}</span>
                            <span class="text-sm text-slate-500">${count} member${count !== 1 ? 's' : ''}</span>
                        </div>
                        <div class="w-full h-2.5 bg-slate-800 rounded-full overflow-hidden">
                            <div class="h-full bg-gradient-to-r from-cyan-500 to-purple-500 rounded-full transition-all duration-700" style="width: ${(count / maxDept) * 100}%"></div>
                        </div>
                    </div>`).join('')}
            </div>
        </div>`;
}

// UTILITIES
// ============================================
function esc(str) {
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
}

function statusBadge(status) {
    const colors = {
        New: 'bg-cyan-500/20 text-cyan-400 border border-cyan-500/30',
        Contacted: 'bg-purple-500/20 text-purple-400 border border-purple-500/30',
        Qualified: 'bg-yellow-500/20 text-yellow-400 border border-yellow-500/30',
        Converted: 'bg-green-500/20 text-green-400 border border-green-500/30',
        Closed: 'bg-slate-500/20 text-slate-400 border border-slate-500/30'
    };
    return `<span class="status-badge inline-block ${colors[status] || ''}">${status}</span>`;
}

function showModal(html) {
    document.getElementById('modalContent').innerHTML = html;
    document.getElementById('modalOverlay').classList.remove('hidden');
    const firstInput = document.querySelector('#modalContent input, #modalContent select, #modalContent textarea');
    if (firstInput) firstInput.focus();
}

function closeModal() { document.getElementById('modalOverlay').classList.add('hidden'); }

function downloadFile(content, filename, type) {
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
}

document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });

// Initial render
showSection('dashboard');
