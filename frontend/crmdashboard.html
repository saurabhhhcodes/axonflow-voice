function showSection(section) {

        const isActive = btn.dataset.section === section;
        btn.classList.toggle('active', isActive);
        if (isActive) btn.setAttribute('aria-current', 'page');
        else btn.removeAttribute('aria-current');
    });

}

function filterEnquiries() {
    const search = (document.getElementById('enqSearch')?.value || '').toLowerCase();
    const status = document.getElementById('enqFilter')?.value || '';
    const filtered = CRM.enquiries.filter(e =>
        (!status || e.status === status) &&
        (!search || e.name.toLowerCase().includes(search) || e.email.toLowerCase().includes(search) || e.company.toLowerCase().includes(search) || e.service.toLowerCase().includes(search))
    );
    document.getElementById('enqTableBody').innerHTML = filtered.length ? filtered.map(e => `
        <tr class="table-row border-b border-slate-800/50">
            <td class="py-3 px-4 text-white font-medium">${esc(e.name)}</td>
            <td class="py-3 px-4 text-slate-400 hidden lg:table-cell">${esc(e.email)}</td>
            <td class="py-3 px-4 text-slate-400 hidden xl:table-cell">${esc(e.phone)}</td>
            <td class="py-3 px-4 text-slate-300 hidden lg:table-cell">${esc(e.company)}</td>
            <td class="py-3 px-4 text-slate-300">${esc(e.service)}</td>
            <td class="py-3 px-4 text-slate-500 hidden md:table-cell max-w-[200px] truncate" title="${esc(e.message)}">${esc(e.message)}</td>
            <td class="py-3 px-4">
                <select class="input-field px-2 py-1 rounded-lg text-xs text-white" onchange="updateEnquiryStatus(${e.id}, this.value)" aria-label="Status for ${esc(e.name)}">
                    ${['New','Contacted','Qualified','Converted','Closed'].map(s => `<option value="${s}" ${s===e.status?'selected':''}>${s}</option>`).join('')}
                </select>
            </td>
            <td class="py-3 px-4 text-slate-500 hidden lg:table-cell">${e.date}</td>
            <td class="py-3 px-4">
                <button onclick="deleteEnquiry(${e.id})" class="text-red-400 hover:text-red-300 transition-colors p-1" aria-label="Delete enquiry from ${esc(e.name)}" title="Delete">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                </button>
            </td>
        </tr>`).join('') : '<tr><td colspan="9" class="py-8 text-center text-slate-500">No enquiries found</td></tr>';
}

function updateEnquiryStatus(id, status) {
    const e = CRM.enquiries.find(x => x.id === id);
    if (e) { e.status = status; saveData(CRM); }
}

function deleteEnquiry(id) {
    if (!confirm('Delete this enquiry?')) return;
    CRM.enquiries = CRM.enquiries.filter(x => x.id !== id);
    saveData(CRM);
    filterEnquiries();
}

function exportEnquiriesCSV() {
    const headers = ['Name','Email','Phone','Company','Service','Message','Date','Status'];
    const rows = CRM.enquiries.map(e => [e.name, e.email, e.phone, e.company, e.service, e.message, e.date, e.status]);
    const csv = [headers, ...rows].map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
    downloadFile(csv, 'enquiries.csv', 'text/csv');
}

function renderProjects(container) {
    container.innerHTML = `
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 mb-6">
            <div class="flex gap-3 w-full sm:w-auto">
                <input type="text" id="projSearch" placeholder="Search projects..." class="input-field px-4 py-2.5 rounded-xl text-white text-sm w-full sm:w-56" oninput="filterProjects()" aria-label="Search projects">
                <select id="projFilter" class="input-field px-3 py-2.5 rounded-xl text-white text-sm" onchange="filterProjects()" aria-label="Filter projects">
                    <option value="">All Status</option>
                    <option>Planning</option><option>In Progress</option><option>Completed</option><option>On Hold</option>
                </select>
            </div>
            <button onclick="openAddProjectModal()" class="btn-gradient px-4 py-2.5 rounded-xl text-sm font-medium text-white">+ Add Project</button>
        </div>
        <div class="glass-card rounded-2xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-sm" role="table">
                    <thead><tr class="border-b border-slate-700/50">
                        <th class="text-left text-slate-400 font-medium py-3 px-4">Project Name</th>
                        <th class="text-left text-slate-400 font-medium py-3 px-4 hidden md:table-cell">Client</th>
                        <th class="text-left text-slate-400 font-medium py-3 px-4">Status</th>
                        <th class="text-left text-slate-400 font-medium py-3 px-4 hidden lg:table-cell">Start Date</th>
                        <th class="text-left text-slate-400 font-medium py-3 px-4 hidden lg:table-cell">End Date</th>
                        <th class="text-left text-slate-400 font-medium py-3 px-4">Value</th>
                        <th class="text-left text-slate-400 font-medium py-3 px-4">Actions</th>
                    </tr></thead>
                    <tbody id="projTableBody"></tbody>
                </table>
            </div>
        </div>`;
    filterProjects();
}

function filterProjects() {
    const search = (document.getElementById('projSearch')?.value || '').toLowerCase();
    const status = document.getElementById('projFilter')?.value || '';
    const filtered = CRM.projects.filter(p =>
        (!status || p.status === status) &&
        (!search || p.name.toLowerCase().includes(search) || p.client.toLowerCase().includes(search))
    );
    const statusColors = {
        'Planning': 'bg-blue-500/20 text-blue-400 border border-blue-500/30',
        'In Progress': 'bg-yellow-500/20 text-yellow-400 border border-yellow-500/30',
        'Completed': 'bg-green-500/20 text-green-400 border border-green-500/30',
        'On Hold': 'bg-red-500/20 text-red-400 border border-red-500/30'
    };
    document.getElementById('projTableBody').innerHTML = filtered.length ? filtered.map(p => `
        <tr class="table-row border-b border-slate-800/50">
            <td class="py-3 px-4 text-white font-medium">${esc(p.name)}</td>
            <td class="py-3 px-4 text-slate-300 hidden md:table-cell">${esc(p.client)}</td>
            <td class="py-3 px-4"><span class="status-badge ${statusColors[p.status] || ''}">${p.status}</span></td>
            <td class="py-3 px-4 text-slate-500 hidden lg:table-cell">${p.startDate}</td>
            <td class="py-3 px-4 text-slate-500 hidden lg:table-cell">${p.endDate}</td>
            <td class="py-3 px-4 text-green-400 font-medium">₹${p.value.toLocaleString()}</td>
            <td class="py-3 px-4">
                <button onclick="openEditProjectModal(${p.id})" class="text-cyan-400 hover:text-cyan-300 transition-colors p-1 mr-1" aria-label="Edit ${esc(p.name)}" title="Edit">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                </button>
                <button onclick="deleteProject(${p.id})" class="text-red-400 hover:text-red-300 transition-colors p-1" aria-label="Delete ${esc(p.name)}" title="Delete">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                </button>
            </td>
        </tr>`).join('') : '<tr><td colspan="7" class="py-8 text-center text-slate-500">No projects found</td></tr>';
}

function deleteProject(id) {
    if (!confirm('Delete this project?')) return;
    CRM.projects = CRM.projects.filter(x => x.id !== id);
    saveData(CRM);
    filterProjects();
}

function openAddProjectModal() {
    showModal(`
        <div class="p-6">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-lg font-bold text-white">Add Project</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white" aria-label="Close"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
            </div>
            <form id="addProjForm" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="sm:col-span-2"><label class="block text-sm text-slate-300 mb-1">Project Name *</label><input required id="ap_name" class="input-field w-full px-3 py-2.5 rounded-xl text-white text-sm"></div>
                    <div><label class="block text-sm text-slate-300 mb-1">Client *</label><input required id="ap_client" class="input-field w-full px-3 py-2.5 rounded-xl text-white text-sm"></div>
                    <div><label class="block text-sm text-slate-300 mb-1">Status *</label>
                        <select required id="ap_status" class="input-field w-full px-3 py-2.5 rounded-xl text-white text-sm">
                            <option>Planning</option><option>In Progress</option><option>Completed</option><option>On Hold</option>
                        </select>
                    </div>
                    <div><label class="block text-sm text-slate-300 mb-1">Start Date *</label><input required type="date" id="ap_start" class="input-field w-full px-3 py-2.5 rounded-xl text-white text-sm"></div>
                    <div><label class="block text-sm text-slate-300 mb-1">End Date *</label><input required type="date" id="ap_end" class="input-field w-full px-3 py-2.5 rounded-xl text-white text-sm"></div>
                    <div class="sm:col-span-2"><label class="block text-sm text-slate-300 mb-1">Value (₹) *</label><input required type="number" id="ap_value" class="input-field w-full px-3 py-2.5 rounded-xl text-white text-sm"></div>
                </div>
                <button type="submit" class="btn-gradient w-full py-3 rounded-xl text-white font-semibold text-sm">Add Project</button>
            </form>
        </div>`);
    document.getElementById('addProjForm').onsubmit = function(e) {
        e.preventDefault();
        const maxId = CRM.projects.reduce((m, x) => Math.max(m, x.id), 0);
        CRM.projects.push({
            id: maxId + 1,
            name: document.getElementById('ap_name').value.trim(),
            client: document.getElementById('ap_client').value.trim(),
            status: document.getElementById('ap_status').value,
            startDate: document.getElementById('ap_start').value,
            endDate: document.getElementById('ap_end').value,
            value: parseInt(document.getElementById('ap_value').value) || 0
        });
        saveData(CRM);
        closeModal();
        filterProjects();
    };
}

function openEditProjectModal(id) {
    const p = CRM.projects.find(x => x.id === id);
    if (!p) return;
    showModal(`
        <div class="p-6">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-lg font-bold text-white">Edit Project</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white" aria-label="Close"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
            </div>
            <form id="editProjForm" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="sm:col-span-2"><label class="block text-sm text-slate-300 mb-1">Project Name *</label><input required id="ep_name" value="${esc(p.name)}" class="input-field w-full px-3 py-2.5 rounded-xl text-white text-sm"></div>
                    <div><label class="block text-sm text-slate-300 mb-1">Client *</label><input required id="ep_client" value="${esc(p.client)}" class="input-field w-full px-3 py-2.5 rounded-xl text-white text-sm"></div>
                    <div><label class="block text-sm text-slate-300 mb-1">Status *</label>
                        <select required id="ep_status" class="input-field w-full px-3 py-2.5 rounded-xl text-white text-sm">
                            ${['Planning','In Progress','Completed','On Hold'].map(s => `<option ${s===p.status?'selected':''}>${s}</option>`).join('')}
                        </select>
                    </div>
                    <div><label class="block text-sm text-slate-300 mb-1">Start Date *</label><input required type="date" id="ep_start" value="${p.startDate}" class="input-field w-full px-3 py-2.5 rounded-xl text-white text-sm"></div>
                    <div><label class="block text-sm text-slate-300 mb-1">End Date *</label><input required type="date" id="ep_end" value="${p.endDate}" class="input-field w-full px-3 py-2.5 rounded-xl text-white text-sm"></div>
                    <div class="sm:col-span-2"><label class="block text-sm text-slate-300 mb-1">Value (₹) *</label><input required type="number" id="ep_value" value="${p.value}" class="input-field w-full px-3 py-2.5 rounded-xl text-white text-sm"></div>
                </div>
                <button type="submit" class="btn-gradient w-full py-3 rounded-xl text-white font-semibold text-sm">Save Changes</button>
            </form>
        </div>`);
    document.getElementById('editProjForm').onsubmit = function(e) {
        e.preventDefault();
        p.name = document.getElementById('ep_name').value.trim();
        p.client = document.getElementById('ep_client').value.trim();
        p.status = document.getElementById('ep_status').value;
        p.startDate = document.getElementById('ep_start').value;
        p.endDate = document.getElementById('ep_end').value;
        p.value = parseInt(document.getElementById('ep_value').value) || 0;
        saveData(CRM);
        closeModal();
        filterProjects();
    };
}

// ---------- ANALYTICS ----------
function renderAnalytics(container) {
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const monthlyCounts = new Array(12).fill(0);
    CRM.enquiries.forEach(e => {
        const m = new Date(e.date).getMonth();
        monthlyCounts[m]++;
    });
    const maxCount = Math.max(...monthlyCounts, 1);

    const statusCounts = {};
    CRM.enquiries.forEach(e => { statusCounts[e.status] = (statusCounts[e.status] || 0) + 1; });
    const statusColors = { New: '#06b6d4', Contacted: '#a855f7', Qualified: '#eab308', Converted: '#22c55e', Closed: '#64748b' };
    const totalEnq = CRM.enquiries.length || 1;
    let pieGradient = '';
    let angle = 0;
    const statusEntries = Object.entries(statusCounts);
    statusEntries.forEach(([status, count]) => {
        const pct = (count / totalEnq) * 360;
        pieGradient += `${statusColors[status] || '#64748b'} ${angle}deg ${angle + pct}deg, `;
        angle += pct;
    });
    pieGradient = pieGradient.slice(0, -2);

    const deptCounts = {};
    CRM.team.forEach(t => { deptCounts[t.department] = (deptCounts[t.department] || 0) + 1; });
    const maxDept = Math.max(...Object.values(deptCounts), 1);

    container.innerHTML = `
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
            <div class="glass-card rounded-2xl p-6">
                <h3 class="text-white font-semibold mb-4">Enquiries by Month</h3>
                <div class="flex items-end space-x-2 h-48">
                    ${monthlyCounts.map((c, i) => `
                        <div class="flex-1 flex flex-col items-center">
                            <div class="w-full bg-gradient-to-t from-cyan-500 to-purple-500 rounded-t-md bar-chart-bar" style="height: ${(c / maxCount) * 160}px; min-height: ${c > 0 ? '8px' : '2px'}" title="${months[i]}: ${c}"></div>
                            <span class="text-xs text-slate-500 mt-2">${months[i]}</span>
                        </div>`).join('')}
                </div>
            </div>
            <div class="glass-card rounded-2xl p-6">
                <h3 class="text-white font-semibold mb-4">Status Breakdown</h3>
                <div class="flex items-center space-x-8">
                    <div class="pie-chart flex-shrink-0" style="background: conic-gradient(${pieGradient});" role="img" aria-label="Status breakdown pie chart"></div>
                    <div class="space-y-2">
                        ${statusEntries.map(([status, count]) => `
                            <div class="flex items-center space-x-2">
                                <div class="w-3 h-3 rounded-full flex-shrink-0" style="background: ${statusColors[status]}"></div>
                                <span class="text-sm text-slate-300">${status}</span>
                                <span class="text-sm text-slate-500 ml-auto">${count}</span>
                            </div>`).join('')}
                    </div>
                </div>
            </div>
        </div>
        <div class="glass-card rounded-2xl p-6">
            <h3 class="text-white font-semibold mb-4">Team Distribution by Department</h3>
            <div class="space-y-4">
                ${Object.entries(deptCounts).map(([dept, count]) => `
                    <div>
                        <div class="flex items-center justify-between mb-1">
                            <span class="text-sm text-slate-300">${dept}</span>
                            <span class="text-sm text-slate-500">${count} member${count !== 1 ? 's' : ''}</span>
                        </div>
                        <div class="w-full h-2.5 bg-slate-800 rounded-full overflow-hidden">
                            <div class="h-full bg-gradient-to-r from-cyan-500 to-purple-500 rounded-full transition-all duration-700" style="width: ${(count / maxDept) * 100}%"></div>
                        </div>
                    </div>`).join('')}
            </div>
        </div>`;
}

// ============================================
// UTILITIES
// ============================================
function esc(str) {
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
}

function statusBadge(status) {
    const colors = {
        New: 'bg-cyan-500/20 text-cyan-400 border border-cyan-500/30',
        Contacted: 'bg-purple-500/20 text-purple-400 border border-purple-500/30',
        Qualified: 'bg-yellow-500/20 text-yellow-400 border border-yellow-500/30',
        Converted: 'bg-green-500/20 text-green-400 border border-green-500/30',
        Closed: 'bg-slate-500/20 text-slate-400 border border-slate-500/30'
    };
    return `<span class="status-badge inline-block ${colors[status] || ''}">${status}</span>`;
}

function showModal(html) {
    document.getElementById('modalContent').innerHTML = html;
    document.getElementById('modalOverlay').classList.remove('hidden');
    const firstInput = document.querySelector('#modalContent input, #modalContent select, #modalContent textarea');
    if (firstInput) firstInput.focus();
}

function closeModal() { document.getElementById('modalOverlay').classList.add('hidden'); }

function downloadFile(content, filename, type) {
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
}

document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });

// Initial render
showSection('dashboard');
</script>
